# CI de la metodología. Corre en cada PR a develop/main y en cada push a esas ramas.
#   reglas         ramas válidas, feature cerrada, tags de gates (.fases/fase ci)
#   comp-<nombre>  tests, lint y tipado de cada componente (los agrega .fases/fase componente agregar)
#   fases          resultado final: es el status check que exige la protección de ramas
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  reglas:
    name: reglas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # historial y tags completos: se verifican los tags de cada gate
          fetch-tags: true
      - name: Reglas de fases y ramas
        run: .fases/fase ci

  # >>> componentes (gestionado por .fases/fase componente agregar)
  # <<< componentes

  fases:
    name: fases
    if: always()
    needs: [reglas] # componentes
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          echo '${{ toJSON(needs) }}'
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == false ]]
