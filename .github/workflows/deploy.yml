# Deploys por entorno (ver docs/METODOLOGIA.md §8):
#   push a develop       → staging
#   tag v* en main       → production
#   Run workflow (manual) → preview, desde la rama que elijas
# Los secretos de cada entorno van en Settings → Environments.
name: Deploy

on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'preview' || startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      ENTORNO: ${{ github.event_name == 'workflow_dispatch' && 'preview' || startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que el tag esté en main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "El tag ${GITHUB_REF_NAME} no apunta a un commit de main."; exit 1; }

      # ── Preparar el stack (completar según ADR-0001) ──────────────────────

      - name: Deploy a ${{ env.ENTORNO }}
        run: scripts/deploy.sh "$ENTORNO"
