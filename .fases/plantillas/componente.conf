# Componente: rutas y comandos. Solo se modifica en fase LIBRE.
# Los comandos se ejecutan dentro de RUTA y deben salir con código 0 si todo está bien.

RUTA="__RUTA__"            # raíz del componente, relativa a la raíz del repo ("." = la raíz)

# Prefijos relativos a RUTA, separados por espacio. "." = toda la carpeta del componente.
# Incluí en RUTAS_TESTS la configuración de tests (ej: "tests/ vitest.config.ts").
RUTAS_SRC="__SRC__"
RUTAS_TESTS="__TESTS__"

TEST_CMD=""        # obligatorio, ej: "pytest"  /  "npm test"  /  "flutter test"
LINT_CMD=""        # ej: "ruff check ."  /  "npx eslint ."
TYPECHECK_CMD=""   # ej: "mypy src"  /  "npx tsc --noEmit"

# Opcional: imprime las firmas públicas del componente. Se guarda en el gate 1
# y se compara en el gate 3 para garantizar que el contrato no cambió.
FIRMAS_CMD=""
